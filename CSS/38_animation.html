<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .box{
            width: 200px;
            height: 200px;
            background-color: yellow;
        }
        .box:hover{
            width: 200px;
            height: 200px;
            border: 1px solid silver;
            animation: changeColor 3s 0s 3; /* name, duration, delay, iteration-count */
        }
        @keyframes changeColor {
            from {background-color: aqua;}
            50% {background-color: tomato;}
            to {background-color: bisque;}
        }
        .box-img{
            width: 600px;
            height: 400px;
            background-image: url(/webpublish/image/img5.jpg);
            background-repeat: no-repeat;
            /* background-size: cover; */
        }
        .box-img:hover{
            width: 600px;
            height: 400px;
            border: 1px solid brown;
            animation: changeImage 10s ease 0s 3;
        }
        @keyframes changeImage{
            from {background-image: url(/webpublish/image/img3.jpg); background-size: contain;}
            30% {background-image: url(/webpublish/image/img4.jpg); background-size: contain;}
            60% {background-image: url(/webpublish/image/img1.jpg); background-size: contain;}
            to {background-image: url(/webpublish/image/img2.jpg); background-size: contain;}
        }
    </style>
</head>
<body>
    <h1>Animation Style</h1>
    <div class="box">box</div>
    <div class="box-img">box</div>
</body>
</html>

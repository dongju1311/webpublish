<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Style</title>
    <style>
        .top{
            width: 100%;
            height: 300px;
            background: #2A7B9B;
            background: linear-gradient(90deg, rgba(42, 123, 155, 1) 0%, rgba(87, 199, 133, 1) 43%, rgba(142, 207, 115, 1) 68%, rgba(237, 221, 83, 1) 100%);
        }
        .radial{
            width: 100%;
            height: 300px;
            background: #8ECF73;
            background: radial-gradient(circle, rgba(142, 207, 115, 1) 53%, rgba(237, 221, 83, 1) 82%);
        }
    </style>
</head>
<body>
    <h1>Gradient Style</h1>
    <div class="top"></div>
    <div class="radial"></div>
</body>
</html>

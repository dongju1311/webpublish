<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List</title>
    <style>
        ul, ol, li{
            border: 1px solid grey;
        }
        ul{padding: 10px;}
        /* li앞에 붙는 동그라미나 숫자 없애거나 다른것으로 바꿀 때 이용! */
        ul > li{
            list-style-type: none;
        }
        ol > li{
            list-style-type: "🌼";
        }
    </style>
</head>
<body>
    <h1>List Style</h1>
    <ul>
        <h3>Front-end</h3>
        <li>HTML 4</li>
        <li>HTML 5</li>
    </ul>
    <ol>
        <h3>Back-end</h3>
        <li>NodeJS</li>
        <li>Spring Boot</li>
    </ol>
</body>
</html>

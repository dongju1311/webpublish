<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margint Auto</title>
    <style>
        /* margin: auto를 사용할 경우 화면크기에 상관없이  margin-left와 margin-right 값을 자동으로 계산하여 수평 가운데에 놓음*/
        header{
            width: 100%;
            background-color: aquamarine;
        }
        .header-top{
            width: 1000px;
            height: 200px;
            background-color: aquamarine;
            text-align: center;
            padding: 10px 0;
            margin: auto;
        }
        main{
            width: 1000px;
            height: 500px;
            background-color: yellow;
            margin: auto;
        }
        h1{
            background-color: tomato;
            color: white;
            width: 600px;
            padding: 20px;
            margin: auto;
        }
        span{
            background-color: blueviolet;
            color: white;
            margin: auto;
            width: 200px;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-top">
        <h1>Margin Auto - Layout</h1>
        </div>
    </header>
    <main>
        <span>
            main content!!
        </span>
    </main>
</body>
</html>
